<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Outer Rounded Square Background with Thick Maroon/Burgundy Border -->
  <rect x="15" y="15" width="470" height="470" rx="90" ry="90" fill="#FCFAF7" stroke="#780016" stroke-width="28" />
  
  <!-- Heart and Sparkle Group, Centered somewhat high up to leave space for text -->
  <g transform="translate(0, -10)">
    <!-- Swirling pink trail / background flow -->
    <path d="M 120,290 C 130,220 180,180 250,210 C 310,230 350,180 370,140" fill="none" stroke="#fbcfe8" stroke-width="25" stroke-linecap="round" opacity="0.6" />
    <path d="M 130,300 C 150,240 200,200 240,240 C 280,270 330,250 360,200" fill="none" stroke="#fbcfe8" stroke-width="12" stroke-linecap="round" opacity="0.4" />
    
    <!-- Sparkle Stars -->
    <!-- Star 1 (Top Left) -->
    <path d="M 160,225 L 163,230 L 168,233 L 163,236 L 160,241 L 157,236 L 152,233 L 157,230 Z" fill="#db2777" />
    <!-- Star 2 (Subtle Top Left) -->
    <path d="M 140,265 L 142,268 L 147,270 L 142,272 L 140,275 L 138,272 L 133,270 L 138,268 Z" fill="#780016" />
    <!-- Star 3 (Top Right) -->
    <path d="M 330,120 L 334,127 L 341,131 L 334,135 L 330,142 L 326,135 L 319,131 L 326,127 Z" fill="#db2777" />
    <!-- Star 4 (Far Top Right) -->
    <path d="M 360,150 L 362,154 L 366,156 L 362,158 L 360,162 L 358,158 L 354,156 L 358,154 Z" fill="#db2777" />
    <!-- Star 5 (Right side) -->
    <path d="M 353,240 L 355,243 L 359,245 L 355,247 L 353,250 L 351,247 L 347,245 L 351,243 Z" fill="#db2777" />

    <!-- Center Heart Structure -->
    <!-- The Heart Path: can be drawn beautifully using bezier curves -->
    <path d="M 250,285 C 250,285 160,230 160,165 C 160,123 193,95 230,105 C 250,111 250,125 250,125 C 250,125 250,111 270,105 C 307,95 340,123 340,165 C 340,230 250,285 250,285 Z" fill="#db2777" stroke="#780016" stroke-width="12" stroke-linejoin="round" />
          
    <!-- White Inner highlight on top-left curve of the Heart -->
    <path d="M 180,160 C 180,135 195,118 215,122" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

    <!-- Motion/swoosh lines on left of heart (representing fast speed/play) -->
    <line x1="160" y1="230" x2="195" y2="195" stroke="#780016" stroke-width="12" stroke-linecap="round" />
    <line x1="160" y1="250" x2="180" y2="230" stroke="#780016" stroke-width="12" stroke-linecap="round" />
    <line x1="185" y1="260" x2="210" y2="235" stroke="#780016" stroke-width="12" stroke-linecap="round" />

    <!-- White Play Triangle in the center of the heart -->
    <polygon points="238,155 238,215 285,185" fill="#ffffff" />

    <!-- Top-Right Chat Bubble with $ symbol -->
    <path d="M 315,145 C 331,145 344,134 344,120 C 344,106 331,95 315,95 C 299,95 286,106 286,120 C 286,128 291,135 299,139 L 295,152 L 307,143 C 310,144 312,145 315,145 Z" fill="#fafaf9" stroke="#780016" stroke-width="6" stroke-linejoin="round" />
    <!-- Dollar Sign Inside the Bubble -->
    <text x="315" y="129" font-family="'Inter', sans-serif" font-weight="950" font-size="30" fill="#db2777" text-anchor="middle">$</text>
    
    <!-- Tiny sunray lines around the top-left of the heart -->
    <line x1="250" y1="85" x2="250" y2="65" stroke="#780016" stroke-width="6" stroke-linecap="round" />
    <line x1="215" y1="90" x2="205" y2="75" stroke="#780016" stroke-width="6" stroke-linecap="round" />
    <line x1="185" y1="110" x2="173" y2="100" stroke="#780016" stroke-width="6" stroke-linecap="round" />
    <line x1="165" y1="140" x2="148" y2="135" stroke="#780016" stroke-width="6" stroke-linecap="round" />
    <line x1="160" y1="180" x2="140" y2="183" stroke="#780016" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="250" y="325" font-family="'Inter', system-ui, sans-serif" font-weight="950" font-size="64" letter-spacing="3" fill="#780016" text-anchor="middle">DONATE</text>
  <text x="250" y="390" font-family="ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif" font-weight="900" font-style="italic" font-size="78" fill="#780016" text-anchor="middle">me!</text>
  
  <g transform="translate(325, 360)">
    <path d="M 0,-15 L 2,-5 L 12,-3 L 2,-1 L 0,9 L -2,-1 L -12,-3 L -2,-5 Z" fill="#db2777" stroke="#780016" stroke-width="2" />
  </g>
  <g transform="translate(170, 380)">
    <path d="M 0,-8 L 1,-3 L 6,-2 L 1,-1 L 0,4 L -1,-1 L -6,-2 L -1,-3 Z" fill="#db2777" stroke="#780016" stroke-width="1.5" />
  </g>

  <text x="250" y="435" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="18" letter-spacing="2.5" fill="#780016" text-anchor="middle">STREAMER SUPPORT SYSTEM</text>
</svg>
